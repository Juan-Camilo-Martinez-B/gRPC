app = "ptc-occ-railway"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"

[http_service.http_options]
  idle_timeout = 600

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
